<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Redirecting…</title>
    <script>
        (function () {
            'use strict';
            var parameters = new URLSearchParams(window.location.search);
            parameters.set('lang', 'id');
            var query = parameters.toString();
            window.location.replace('../' + (query ? '?' + query : '') + window.location.hash);
        })();
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=../?lang=id" /></noscript>
</head>
<body>
    <p>Redirecting to the unified portfolio…</p>
</body>
</html>
