<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Sulu Edward Julianto — Full-Stack Developer</title>
  <desc id="description">Professional portfolio preview card featuring Sulu Edward Julianto.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.58" stop-color="#0f2748"/>
      <stop offset="1" stop-color="#0b4b73"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="portrait">
      <rect x="783" y="58" width="347" height="514" rx="48"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" rx="32" fill="url(#background)"/>
  <circle cx="1035" cy="118" r="340" fill="url(#glow)"/>
  <circle cx="105" cy="590" r="230" fill="url(#glow)" opacity="0.42"/>
  <path d="M0 540 C250 475 455 610 720 522 C905 460 1065 462 1200 520 V630 H0Z" fill="#0ea5e9" opacity="0.08"/>
  <path d="M0 574 C242 506 445 634 710 558 C892 506 1057 508 1200 556 V630 H0Z" fill="#38bdf8" opacity="0.09"/>

  <g transform="translate(72 70)">
    <rect width="174" height="42" rx="21" fill="#0e7490" opacity="0.66"/>
    <circle cx="24" cy="21" r="5" fill="#67e8f9"/>
    <text x="42" y="27" fill="#cffafe" font-family="Poppins, Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2.1">PORTFOLIO</text>

    <text x="0" y="150" fill="#f8fafc" font-family="Poppins, Inter, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-1.4">SULU EDWARD</text>
    <text x="0" y="220" fill="#f8fafc" font-family="Poppins, Inter, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-1.4">JULIANTO</text>
    <rect x="0" y="248" width="112" height="6" rx="3" fill="url(#accent)"/>

    <text x="0" y="307" fill="#7dd3fc" font-family="Poppins, Inter, Arial, sans-serif" font-size="29" font-weight="600">FULL-STACK DEVELOPER</text>
    <text x="0" y="357" fill="#cbd5e1" font-family="Poppins, Inter, Arial, sans-serif" font-size="21">Web Applications  ·  APIs  ·  Software Engineering</text>

    <g transform="translate(0 424)">
      <circle cx="8" cy="8" r="8" fill="#22d3ee"/>
      <text x="31" y="16" fill="#e2e8f0" font-family="Poppins, Inter, Arial, sans-serif" font-size="20" font-weight="500">sulujulianto.github.io</text>
    </g>
  </g>

  <g>
    <rect x="765" y="40" width="383" height="550" rx="62" fill="#e0f2fe" opacity="0.2"/>
    <rect x="775" y="50" width="363" height="530" rx="54" fill="#0f172a" stroke="#7dd3fc" stroke-width="2" stroke-opacity="0.7"/>
    <image href="profile-card.png" x="783" y="58" width="347" height="514" preserveAspectRatio="xMidYMid slice" clip-path="url(#portrait)"/>
  </g>

  <rect x="1.5" y="1.5" width="1197" height="627" rx="30.5" fill="none" stroke="#7dd3fc" stroke-opacity="0.26" stroke-width="3"/>
</svg>
