name: Portfolio CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium for render-stability tests
        run: npx playwright install --with-deps chromium

      - name: Build and test portfolio
        run: npm run verify

      - name: Confirm generated assets are committed
        run: git diff --exit-code -- assets/css/output.css assets/js/dist
